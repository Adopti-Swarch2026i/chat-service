server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE:/app/certs/keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: chat-service
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3

spring:
  application:
    name: chat-service
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    websocket:
      path: /graphql
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5671}
    username: ${SPRING_RABBITMQ_USERNAME:adopti}
    password: ${SPRING_RABBITMQ_PASSWORD:rabbitmq_secret}
    ssl:
      enabled: true
      algorithm: TLSv1.3
      trust-store: file:/app/certs/truststore.jks
      trust-store-password: ${SSL_TRUSTSTORE_PASSWORD:changeit}
      verify-hostname: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://securetoken.google.com/adoptiswarch-dc4da}

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:src/main/resources/adoptiswarch-dc4da-firebase-adminsdk-fbsvc-21e2ea6cae.json}
